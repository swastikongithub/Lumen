# Lumen corpus: official LPU documents (CLAUDE.md rule 5, SPEC §3 and §8).
#
# Two parts:
#   1. lpu.in documents (this part). Every URL opens without a login.
#   2. UMS-linked student policies (`origin: ums`), further down, with
#      their own note.
# Every file in both parts was checked for personal data (student names,
# registration numbers) on 26 Nov 2026.
#
# Not included:
#   - lpu.in/placements.php, because it names placed students with their
#     packages (personal data)
#   - Scribd, GitHub and other third-party copies of LPU rules, because they
#     are unofficial and often outdated
#   - any student's own UMS pages (marks, attendance, fees, profile, cases)
#
# robots.txt: lpu.in blocks generic crawlers from /downloads and /sustainable
# but allows named AI agents everywhere. Entries under those paths are marked
# `fetch: manual`. The ingester never downloads them automatically: save the
# file in a browser as data/raw/<id>.<ext> and it is used from there. The
# public `url` is still what citations link to.
#
# `fetch: manual` is also used for files that must be converted by hand:
# a legacy .doc (save as PDF in Word), a PDF inside a .zip, or a page that
# needs a login. Save the result as data/raw/<id>.pdf (or .md).
#
# category: academics | exams | hostel | fees | placements | other
# academic_year: only when the document states it.
# origin: `ums` for UMS-linked policies; left out for lpu.in documents.

