# ===========================================================================
# Part 2: UMS-linked student policies (origin: ums)
#
# Added at the project owner's direction on 26 Nov 2026 (SPEC §3.2). These
# are general rules, guidelines and policies that UMS links to for all
# students. Each `url` opens without a login (checked 26 Nov 2026). There is
# one exception: fee-payment-schedule, whose page needs a login, so its
# batch-level text was copied by hand.
#
# ums.lpu.in and files.lpu.in robots.txt allow all agents. They also carry
# the Cloudflare content signal `search=yes, ai-train=no`: Lumen uses these
# files only to retrieve and cite, never to train a model.
#
# Not included:
#   - placement result lists and research incentive lists (student names)
#   - older versions where a newer one is linked: the 2023 Career Services
#     Policy, an older copy of the credit transfer guideline, the 2011 dual
#     degree option guideline, and duplicate copies of the Annexure 6.0
#     candidate instructions
#   - online (My Class) exam guidelines, which only applied while exams
#     were held online
#   - forms, request formats and notices from outside bodies
#   - two DSA files UMS still lists that return 404: Rules for Cultural
#     Clubs and Selection Process for AIU
#
# Unfair Means Cases (UMC): the acts that count as a UMC and their
# consequences are in summer-term-exam-instructions (section 34.0) and the
# other candidate instructions. No document students can open gives the
# penalty scale or the UMC hearing and appeal procedure, so Lumen should
# abstain on those.
# ===========================================================================

